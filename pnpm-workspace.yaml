allowBuilds:
  # https://pnpm.io/settings#allowbuilds
  esbuild: true
  lefthook: true
  unrs-resolver: true
  "@sentry/cli": false
  core-js: false
  core-js-pure: false
  protobufjs: false

overrides:
  "tar@<=7.5.17": ">=7.5.18"
  "qs@<=6.16.0": ">=6.16.1"
  "browserslist@<=4.28.6": ">=4.28.7"
  body-parser@<2.4.0: ">=2.4.0"
  brace-expansion@<=5.0.9: ">=5.0.12"
  "undici@^6.0.0": "^6.28.1"
  "dompurify@<=3.4.16": ">=3.4.17"
  "ip-address@<=10.7.3": ">=10.7.4"
  "parse5-parser-stream@<=8.1.0": ">=8.1.1" ## fix issue with new major version of jsdom

dedupePeers: true
preferFrozenLockfile: true
blockExoticSubdeps: true

trustPolicy: no-downgrade # https://pnpm.io/settings#trustpolicy

trustPolicyExclude:
  - chokidar@4.0.3 # solved by upgrading to 5.0.0, see https://github.com/paulmillr/chokidar/issues/1440
  - semver@6.3.1 # solved by upgrading to 7.x
  - hosted-git-info@6.1.3 # solved by upgrading to 6.1.4
  - why-is-node-running@3.2.2 # vitest 5

minimumReleaseAgeExclude:
  - "@digitalservicebund/a2j-xjustiz-bridge@0.12.1"
  - "@digitalservicebund/kern-ux-tailwind-theme@4.0.0 || 4.1.0"
