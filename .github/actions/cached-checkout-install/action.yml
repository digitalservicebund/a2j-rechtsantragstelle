name: "Cached Checkout & Install"
description: "Checks out repository, downloads node, caches node_modules and installs project"
runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      name: Install pnpm
      with:
        run_install: false
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version-file: "package.json"
        cache: "pnpm"
    - name: Grab node version
      run: echo "NODE_VERSION=$(node --version)" >> $GITHUB_ENV
      shell: bash
    - name: Perform a clean install of node dependencies
      run: pnpm i --prod=false # force to install dev dependencies as well, since they are needed for e2e tests
      shell: bash
